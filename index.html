<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesan Rahasia Untukmu Alexa Beatrice 😋🦋🩵</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle, #000000, #1a0000);
  color: white;
  overflow: hidden;
}

/* SLIDE */
.slide {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
  animation: fade 1s;
}

.active { display: flex; }

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}

/* BUTTON */
button {
  margin-top: 15px;
  padding: 10px 20px;
  background: crimson;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff4d6d;
  transform: scale(1.05);
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

img, video {
  max-width: 260px;
  border-radius: 15px;
  margin-top: 10px;
}

.glitch {
  color: red;
  animation: glitch 1s infinite;
}

@keyframes glitch {
  0% {opacity: 1;}
  50% {opacity: 0.3;}
  100% {opacity: 1;}
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  z-index: 999;
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

/* LOVE */
.love {
  position: fixed;
  font-size: 18px;
  top: -10px;
  animation: loveFall linear infinite;
  z-index: 999;
}

@keyframes loveFall {
  to { transform: translateY(110vh); }
}

p {
  text-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
}
</style>
</head>

<body>

<audio id="musik" loop>
  <source src="musik.mp3">
</audio>

<div style="position: fixed; top: 20px; right: 20px;">
  <button id="toggleBtn" onclick="toggleMusik()">Pause Music 🎵</button>
</div>

<!-- SLIDES -->
<div class="slide active">
  <h1>🔒 Locked Message</h1>
  <input type="password" id="kode" placeholder="Enter password">
  <button onclick="cekKode()">Unlock</button>
  <p id="error" class="glitch"></p>
</div>

<div class="slide">
  <h1>You did it! 😊</h1>
  <button onclick="nextSlide()">Next ➡</button>
</div>

<div class="slide">
  <img src="foto1.jpeg">
  <p>You are more than you think ❤️</p>
  <button onclick="nextSlide()">Next ➡</button>
</div>

<div class="slide">
  <video controls>
    <source src="vidio2.mp4">
  </video>
  <button onclick="nextSlide()">Next ➡</button>
</div>

<div class="slide">
  <img src="jiro.jpg">
  <p>I like you more than I planned ❤️</p>
  <button onclick="nextSlide()">Next ➡</button>
</div>

<div class="slide">
  <img src="betris.jpeg">
  <button onclick="nextSlide()">Next ➡</button>
</div>

<div class="slide">
  <h2>CONGRATS 🎉</h2>
  <button onclick="startConfetti(); startLove(); nextSlide()">Next ➡</button>
</div>

<!-- LETTER -->
<div class="slide">
  <button onclick="mulaiKetik()">✉️ Open Letter</button>
  <div id="kertasSurat" style="display:none; background:#fff; color:#000; padding:20px; max-width:400px; height:300px; overflow:auto;">
    <p id="teksJalan"></p>
  </div>
  <button onclick="nextSlide()">Next ➡</button>
</div>

<!-- FINAL INTERACTIVE -->
<div class="slide">
  <h1>💙 One Last Thing...</h1>

  <div class="btn-group">
    <button onclick="pilih()">Aku juga 💙</button>
    <button onclick="kaburBtn(this)">Hmm... 🤭</button>
  </div>

  <p id="respon"></p>
</div>

<script>
let slides = document.querySelectorAll(".slide");
let current = 0;
const musik = document.getElementById("musik");

function showSlide(i){
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

function nextSlide(){
  if(current < slides.length - 1){
    current++;
    showSlide(current);

    if(current === slides.length - 1){
      gantiMusik();
    }
  }
}

function cekKode(){
  if(document.getElementById("kode").value.toLowerCase() === "alexa beatrice"){
    current = 1;
    showSlide(current);
  } else {
    document.getElementById("error").innerText = "Wrong password...";
  }
}

/* LETTER */
const isiSurat = "Aku cuma mau bilang... kamu berarti banget buat aku 💙";

function mulaiKetik(){
  let i=0;
  let target = document.getElementById("teksJalan");
  let box = document.getElementById("kertasSurat");
  box.style.display="block";
  target.innerHTML="";

  function ketik(){
    if(i<isiSurat.length){
      target.innerHTML += isiSurat[i];
      i++;
      setTimeout(ketik,50);
    }
  }
  ketik();
}

/* INTERACTIVE */
function pilih(){
  document.getElementById("respon").innerText = "Aku tau kok 😊💙";
  loveExplosion();
}

function kaburBtn(btn){
  btn.style.transform = `translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`;
}

/* EFFECT */
function startConfetti(){
  for(let i=0;i<30;i++){
    let d=document.createElement("div");
    d.className="confetti";
    d.style.left=Math.random()*100+"vw";
    d.style.background=["red","blue","yellow"][Math.floor(Math.random()*3)];
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4000);
  }
}

function startLove(){
  for(let i=0;i<20;i++){
    let d=document.createElement("div");
    d.className="love";
    d.innerText="❤️";
    d.style.left=Math.random()*100+"vw";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4000);
  }
}

function loveExplosion(){
  for(let i=0;i<40;i++){
    let d=document.createElement("div");
    d.innerText="💙";
    d.style.position="fixed";
    d.style.left="50%";
    d.style.top="50%";
    let x=(Math.random()-0.5)*500;
    let y=(Math.random()-0.5)*500;
    document.body.appendChild(d);
    setTimeout(()=>{d.style.transform=`translate(${x}px,${y}px)`; d.style.opacity=0;},10);
    setTimeout(()=>d.remove(),1000);
  }
}

/* MUSIC */
function toggleMusik(){
  if(musik.paused){
    musik.play();
  } else {
    musik.pause();
  }
}

function gantiMusik(){
  musik.pause();
  musik.src="musik2.mp3";
  musik.play();
}

/* AUTOPLAY */
document.body.addEventListener("click",()=>{
  if(musik.paused) musik.play();
},{once:true});
</script>

</body>
</html>
